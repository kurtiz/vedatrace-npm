name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # This MUST match the environment name in your npm Trusted Publisher settings
    environment: release
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # We remove registry-url here to let OIDC handle the auth flow naturally

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun run test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish: bun run ci:publish
          version: bun run ci:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # These flags force npm (called by changesets) to use the OIDC provenance flow
          NPM_CONFIG_PROVENANCE: true