name: Release

# One workflow, two states, decided by whether a publish is owed:
#
#   commit `fix:`/`feat:` lands on main
#     -> no publish owed  -> `tegami version` bumps, writes .tegami/publish-lock.yaml,
#                            and opens the version PR (auto-merged below)
#   version PR merges
#     -> publish owed     -> `tegami publish` ships to npm, tags, and cuts the release
#
# `tegami ci` collapses both into one command, but it versions with the
# publish-lock check disabled — which, with commit-derived changelogs, lets the
# post-merge run version a second time instead of publishing. The explicit
# check-publish branch below keeps that guard on.

on:
  push:
    branches:
      - main
      - beta
      - alpha

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Must match the environment name in your npm Trusted Publisher settings.
    environment: release
    env:
      # The `secrets` context is not available in a step-level `if`. Referencing
      # it there is a workflow syntax error rather than a falsy condition, and it
      # fails the whole file at startup — including the branch filters, so the
      # run fires on branches `on:` excludes. Job-level `env` may read secrets and
      # step-level `if` may read `env`, so the guard goes through here.
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Tegami reads commits back to the latest tag, so a shallow clone would
          # see no history and release nothing.
          fetch-depth: 0

      # Work the version PR as the GitHub App rather than as the built-in
      # GITHUB_TOKEN. Anything GITHUB_TOKEN does is barred from triggering
      # another workflow run, so a version PR it opened would get no CI, and a
      # merge it performed would never start the publish job. An App token has
      # no such restriction, which is what closes the loop.
      #
      # Skipped until the secrets exist; every step below then falls back to
      # github.token and the release still runs, just needing a nudge to publish.
      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Tegami requires Node 24+. Trusted publishing needs >= 22.14.0, so 24
          # satisfies both. No registry-url: an .npmrc with a token would make npm
          # authenticate with that token instead of the OIDC exchange.
          node-version: '24'

      # setup-node ships the npm bundled with Node; trusted publishing needs
      # npm >= 11.5.1. Without this the publish falls back to token auth — and
      # there is no token — so it fails at the last step.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Runs before either branch below, so a version PR is never opened from a
      # broken tree and a publish never ships one.
      - name: Verify
        run: |
          bun run lint:ci
          bun run typecheck
          bun run test
          bun run build
          bunx publint@latest
          bunx @arethetypeswrong/cli@latest --pack . --profile node16
          bun run smoke

      - name: Is a publish owed?
        id: state
        run: |
          if bun run release:check; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.state.outputs.publish == 'true'
        run: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Version packages
        if: steps.state.outputs.publish == 'false'
        run: bun run release:version
        env:
          # Opening the PR as the App is what lets CI run on it, so the
          # --auto merge below has real checks to wait for.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      # Turn on auto-merge for the version PR so a release needs no second click.
      # Set the repository variable AUTO_MERGE_RELEASE to "false" to review every
      # bump by hand instead.
      - name: Enable auto-merge on the version PR
        if: steps.state.outputs.publish == 'false' && vars.AUTO_MERGE_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          pr=$(gh pr list --head tegami/version-packages --base "${GITHUB_REF_NAME}" \
                 --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open version PR; nothing to auto-merge."
            exit 0
          fi
          # --auto waits for required checks when the repo has them; it errors if
          # auto-merge is disabled in repo settings, in which case merge outright.
          gh pr merge "$pr" --squash --auto || gh pr merge "$pr" --squash
