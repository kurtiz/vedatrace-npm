name: CI
on:
  pull_request:
    branches:
      - main
      - beta
      - alpha
  push:
    branches-ignore:
      - main
      - beta
      - alpha
jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
